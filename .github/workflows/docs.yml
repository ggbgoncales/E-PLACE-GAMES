name: Documentação

on:
  push:
    branches: [main]
    paths: ["eplace-docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["eplace-docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eplace-docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eplace-docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: eplace-docs/build

  # Publicação manual no GitHub Pages: Actions > Documentação > Run workflow.
  # Antes, um administrador precisa ativar Settings > Pages > Source: GitHub Actions.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
